<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헬로 페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      color: #fff;
      text-align: center;
    }
    .card {
      padding: 48px 56px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 3rem; margin-bottom: 12px; }
    p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 24px; }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #764ba2;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕하세요! 👋</h1>
    <p>Hello, World! 첫 번째 헬로 페이지입니다.</p>
    <button onclick="this.textContent = '반갑습니다! 😊'">인사하기</button>
  </div>
</body>
</html>
